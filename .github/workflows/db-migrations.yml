name: db-migrations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-migrations:
    name: postgres migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chain_indexer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chain_indexer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build migration bundle
        run: npm run build
      - name: Check migration schema against generated metadata
        run: npm run db:migration:check
      - name: Apply migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: chain_indexer
          DB_USER: postgres
          DB_PASS: postgres
        run: npm run db:migrate
      - name: Re-run migrations idempotently
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: chain_indexer
          DB_USER: postgres
          DB_PASS: postgres
        run: npm run db:migrate
